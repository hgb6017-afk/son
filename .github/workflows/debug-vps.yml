name: VPS Linux Free

on:
  workflow_dispatch:

jobs:
  run-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Khoi tao VPS va mo tunnel SSH
        run: |
          # 1. Cai dat mat khau cho tai khoan runner va root
          echo "runner:123456" | sudo chpasswd
          echo "root:123456" | sudo chpasswd

          # 2. Cho phep dang nhap SSH bang mat khau
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh

          # 3. Tai Bore (cong cu tunnel khong can the, khong can dang ky)
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x ./bore

          echo "=================================================="
          echo "DA KHOI TAO XONG! XEM CONG KET NOI O DONG DUOI:"
          echo "Mat khau dang nhap: 123456"
          echo "=================================================="

          # 4. Mo cong ket noi qua bore.pub
          ./bore local 22 --to bore.pub
